version: "3.9"  
services:
  app:  
    build:
      context: .  
      dockerfile: Dockerfile  
    ports:
      - "8501:8501"  
    volumes:
      - ./src:/app/src
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}  
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}  
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
